apiVersion: v1
kind: Pod
metadata:
  name: test-nfsha-pod
spec:
  restartPolicy: Always
  containers:
    - name: writer
      image: busybox:1.36
      command:
        - sh
        - -c
        - "echo hello-from-$(hostname) > /data/test.txt && sleep 3600"
      volumeMounts:
        - name: shared-data
          mountPath: /data
  volumes:
    - name: shared-data
      persistentVolumeClaim:
        claimName: test-nfsha
