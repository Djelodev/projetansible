name: Validate lab configuration

on:
  push:
  pull_request:

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validators
        run: python -m pip install pyyaml ansible-core
      - name: Validate YAML and Vagrant syntax
        run: python scripts/validate-static.py
      - name: Check Ansible playbook syntax
        run: |
          ansible-playbook -i ansible-playbooks/etc/hosts --syntax-check ansible-playbooks/playbooks/site.yml
          ansible-playbook -i ansible-playbooks/etc/hosts --syntax-check ansible-playbooks/playbooks/verify_cluster.yml
          ansible-playbook -i ansible-playbooks/etc/hosts --syntax-check ansible-playbooks/playbooks/install_argocd.yml
          ansible-playbook -i ansible-playbooks/etc/hosts --syntax-check ansible-playbooks/playbooks/install_ingress_nginx.yml
